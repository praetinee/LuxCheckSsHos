<!DOCTYPE html>
<html lang="th" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>ระบบบันทึกผลตรวจวัดแสงสว่าง รพ.สันทราย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{--bg:#eef2f7;--card:#fff;--soft:#f1f5f9;--line:#dbe3ec;--edge:#e2e8f0;--faint:#8c9cb0;
  --tx:#16202a;--mut:#64748b;--br:#0e7490;--br2:#0891b2;--acc:#14b8a6;
  --pass:#15803d;--passbg:#dcfce7;--fail:#dc2626;--failbg:#fee2e2;--warn:#b45309;--warnbg:#fef3c7;
  --c-low:#e39b97;--c-ok:#9ccbb3;--c-hi:#ecd3a0;--c-none:#e5eaf1;
  --onbr:#fff;--onpass:#fff;--hdtx:#fff;--hdbg:linear-gradient(135deg,#0e7490,#0f766e);
  --navbg:rgba(255,255,255,.95);--ovlbg:#fff;--tip:#16202a;--tiptx:#fff;
  --sh:0 1px 2px rgba(16,32,48,.06),0 1px 8px rgba(16,32,48,.05);color-scheme:light}
html[data-theme="dark"],
html[data-theme="auto"].dk{--bg:#0b1220;--card:#131f31;--soft:#1b2a3f;--line:#24364f;--edge:#223147;--faint:#7589a3;
  --tx:#e8eff7;--mut:#93a7bf;--br:#22d3ee;--br2:#38bdf8;--acc:#2dd4bf;
  --pass:#4ade80;--passbg:#0b3a24;--fail:#f87171;--failbg:#45161a;--warn:#fbbf24;--warnbg:#402d08;
  --c-low:#9e5351;--c-ok:#47836a;--c-hi:#8a6c3c;--c-none:#22314a;
  --onbr:#06222b;--onpass:#05230f;--hdtx:#eaf6fa;--hdbg:linear-gradient(135deg,#0b3a4a,#0d3f3c);
  --navbg:rgba(19,31,49,.95);--ovlbg:#0f1a2b;--tip:#e8eff7;--tiptx:#0b1220;
  --sh:0 1px 2px rgba(0,0,0,.3),0 1px 10px rgba(0,0,0,.25);color-scheme:dark}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);
  font-family:"Chakra Petch","Noto Sans Thai",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
#app{max-width:620px;margin:0 auto;min-height:100dvh}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit;color:var(--tx);background:var(--card);border-color:var(--line)}
input::placeholder,textarea::placeholder{color:var(--faint)}
.hd{position:sticky;top:0;z-index:20;background:var(--hdbg);color:var(--hdtx);padding:10px 14px 12px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.hd h1{margin:0;font-size:clamp(.98rem,3.4vw,1.15rem);font-weight:700}
.hd .sub{font-size:.75rem;opacity:.88;margin-top:1px}
.hdrow{display:flex;align-items:center;gap:8px}
.hdrow .grow{flex:1;min-width:0}
.ysel,.thbtn{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:var(--hdtx);border-radius:10px;padding:7px 10px;font-size:.88rem;font-weight:700}
.thbtn{padding:7px 9px}
.ysel option{color:#111;background:#fff}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--mut);white-space:nowrap}
.chip.p{background:var(--passbg);color:var(--pass)}
.chip.f{background:var(--failbg);color:var(--fail)}
.chip.w{background:var(--warnbg);color:var(--warn)}
.chip.b{background:var(--soft);color:var(--br)}
.wrap{padding:12px 12px 96px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);margin-bottom:10px;overflow:hidden}
.card.pad{padding:12px 14px}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.kpi div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center;box-shadow:var(--sh)}
.kpi b{display:block;font-size:clamp(1.05rem,4.4vw,1.3rem);line-height:1.15}
.kpi span{font-size:.66rem;color:var(--mut)}
.bar{height:7px;background:var(--edge);border-radius:99px;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--br2),var(--acc))}
.srch{display:flex;gap:8px;margin-bottom:10px}
.srch input{flex:1;border:1px solid var(--line);border-radius:12px;padding:11px 13px;box-shadow:var(--sh)}
.tog{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tog::-webkit-scrollbar{display:none}
.tog button{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:.82rem;white-space:nowrap;box-shadow:var(--sh)}
.tog button.on{background:var(--br);color:var(--onbr);border-color:var(--br);font-weight:700}
.secrow{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.secrow:last-child{border-bottom:0}
.secrow .nm{flex:1;min-width:0;font-size:.92rem;font-weight:600}
.secrow .nm em{display:block;font-style:normal;font-weight:400;font-size:.73rem;color:var(--mut);margin-top:2px}
.secrow .rt{text-align:right;font-size:.73rem;color:var(--mut);white-space:nowrap}
.ring{width:38px;height:38px;flex:0 0 38px;border-radius:50%;display:grid;place-items:center;font-size:.67rem;font-weight:700;color:var(--br)}
.ring i{background:var(--card);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal}
.gh{font-size:.78rem;font-weight:700;color:var(--mut);padding:14px 4px 6px}
.prow{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.prow:last-child{border-bottom:0}
.prow .no{flex:0 0 30px;font-size:.72rem;color:var(--mut);text-align:center}
.prow .mid{flex:1;min-width:0}
.prow .t{font-size:.92rem;font-weight:600;line-height:1.3}
.prow .m{font-size:.72rem;color:var(--mut);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.prow .val{flex:0 0 78px;text-align:right}
.prow .val b{font-size:1.08rem;display:block;line-height:1.1}
.prow .val s{display:block;font-size:.65rem;color:var(--mut);text-decoration:none}
.yrow{align-items:flex-start}
.yrow .t{margin-bottom:4px}
.yl{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:.84rem;
  padding:3px 0;border-top:1px solid var(--line);color:var(--mut)}
.yl:first-of-type{margin-top:5px}
.yl b{font-size:1rem;font-variant-numeric:tabular-nums}
.vp{color:var(--pass)}.vf{color:var(--fail)}.vn{color:var(--mut)}
.btn{display:block;width:100%;background:var(--br);color:var(--onbr);border-radius:13px;padding:14px;font-weight:700;text-align:center;box-shadow:var(--sh)}
.btn.g{background:var(--pass);color:var(--onpass)}
.btn.o{background:var(--card);color:var(--br);border:1px solid var(--line)}
.btn.r{background:var(--card);color:var(--fail);border:1px solid var(--line)}
.btn:active{transform:scale(.985)}
.btn2{display:flex;gap:8px;margin-bottom:10px}
.btn2>*{flex:1}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--navbg);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);display:flex;padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;text-align:center;font-size:.68rem;color:var(--mut);padding:4px 0}
.nav button b{display:block;font-size:1.15rem;line-height:1.3;font-weight:400}
.nav button.on{color:var(--br);font-weight:700}
.ovl{position:fixed;inset:0;z-index:50;background:var(--ovlbg);display:flex;flex-direction:column;max-width:620px;margin:0 auto}
.ovl .top{background:var(--hdbg);color:var(--hdtx);padding:9px 12px}
.ovl .top .r1{display:flex;align-items:center;gap:8px;font-size:.78rem;opacity:.92}
.ovl .top h2{margin:3px 0 0;font-size:1rem;font-weight:700;line-height:1.3}
.ovl .top .r2{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.ovl .top .chip{background:rgba(255,255,255,.2);color:var(--hdtx)}
.disp{padding:10px 14px 6px;text-align:center;border-bottom:1px solid var(--line)}
.disp .big{font-size:clamp(2.3rem,11vw,3rem);font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.disp .u{font-size:1rem;font-weight:600;color:var(--mut);margin-left:4px}
.disp .vd{font-size:.82rem;font-weight:700;margin-top:1px;min-height:1.2em}
.disp .hist{font-size:.74rem;color:var(--mut);margin-top:4px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.pad{flex:1;display:flex;flex-direction:column;padding:8px 10px calc(10px + env(safe-area-inset-bottom));gap:8px;min-height:0;overflow-y:auto}
.stat{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.stat::-webkit-scrollbar{display:none}
.stat button{border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:.8rem;white-space:nowrap;background:var(--soft)}
.stat button.on{background:var(--br);color:var(--onbr);border-color:var(--br);font-weight:700}
.stat button.on.rm{background:var(--fail);border-color:var(--fail);color:var(--onpass)}
.nt{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:var(--soft)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.keys button{background:var(--soft);border:1px solid var(--line);border-radius:12px;font-size:1.5rem;font-weight:600;
  height:clamp(48px,7.6vh,60px);display:grid;place-items:center;font-variant-numeric:tabular-nums}
.keys button:active{background:var(--br);color:var(--onbr)}
.keys button.sm{font-size:1.05rem}
.go{display:flex;gap:7px;align-items:stretch}
.go .arr{flex:0 0 52px;background:var(--soft);border:1px solid var(--line);border-radius:12px;font-size:1.3rem;display:grid;place-items:center}
.go .mainb{flex:1;background:var(--pass);color:var(--onpass);border-radius:12px;font-weight:700;font-size:1rem;padding:13px 8px}
.go .mainb small{display:block;font-weight:400;font-size:.7rem;opacity:.9}
.x{font-size:1.5rem;line-height:1;padding:2px 8px;color:var(--hdtx)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:90;background:var(--tip);color:var(--tiptx);
  padding:9px 15px;border-radius:999px;font-size:.84rem;box-shadow:0 4px 16px rgba(0,0,0,.3);opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:.97}
.sync{font-size:.68rem;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.2)}
.ta{width:100%;height:150px;border:1px solid var(--line);border-radius:11px;padding:8px;font-family:ui-monospace,monospace;font-size:.7rem;background:var(--soft)}
.sm{font-size:.78rem;color:var(--mut)}
.row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0;font-size:.92rem;font-weight:600}
.stp{display:flex;align-items:center;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--card)}
.stp button{width:40px;height:44px;font-size:1.25rem;font-weight:700;color:var(--br);background:var(--soft)}
.stp button:active{background:var(--br);color:var(--onbr)}
.stp input.n{width:72px;height:44px;text-align:center;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);
  background:var(--card);font-size:1rem;font-weight:700;font-variant-numeric:tabular-nums;padding:0}
.lx{font-size:.74rem;color:var(--mut);width:24px}
.pinbox{display:flex;gap:10px;justify-content:center;margin:14px 0 6px}
.pinbox i{width:44px;height:54px;border:2px solid var(--line);border-radius:12px;display:grid;place-items:center;
  font-size:1.5rem;font-style:normal;font-weight:700;background:var(--soft)}
.pinbox i.on{border-color:var(--br)}
.pinbox i.err{border-color:var(--fail);background:var(--failbg)}
.mdl{position:fixed;inset:0;z-index:60;background:rgba(6,14,24,.55);display:flex;align-items:flex-end;justify-content:center}
.mdl .box{background:var(--card);width:100%;max-width:620px;border-radius:16px 16px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom));max-height:88dvh;overflow-y:auto}
.mdl h3{margin:0 0 10px;font-size:1rem}
.fld{margin-bottom:10px}
.fld label{display:block;font-size:.76rem;color:var(--mut);margin-bottom:4px}
.fld input,.fld select{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:var(--soft)}
.empty{text-align:center;color:var(--mut);padding:28px 16px;font-size:.88rem}
.pk{display:flex;flex-direction:column;gap:4px;margin-top:6px;max-height:34vh;overflow-y:auto}
.pk button{text-align:left;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--soft);font-size:.9rem}
.pk button:active{background:var(--br);color:var(--onbr)}
.pkd{display:flex;align-items:center;gap:8px;border:1px solid var(--br);border-radius:11px;padding:10px 12px;background:var(--soft)}
.pkd span{flex:1;min-width:0;font-weight:600}
.pkd button{color:var(--br);font-size:.82rem;font-weight:700;white-space:nowrap}
/* charts */
.dn{width:clamp(130px,38vw,160px);height:clamp(130px,38vw,160px);display:block;margin:0 auto}
.dnv{fill:var(--tx);font-size:30px;font-weight:700}
.dns{fill:var(--mut);font-size:12px}
.lg{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;font-size:.74rem;color:var(--mut);margin-top:4px}
.lg i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:4px;vertical-align:-1px}
.sb{margin:11px 0}
.sb .lb{display:flex;justify-content:space-between;font-size:.78rem;margin-bottom:4px;gap:8px}
.sb .lb span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb .tr{display:flex;height:9px;border-radius:99px;overflow:hidden;background:var(--c-none)}
.sb .tr i{display:block;height:100%}
.ur{padding:2px 0}
.ur .lb b{font-weight:600}
.hist{display:flex;align-items:flex-end;gap:3px;height:120px;padding-top:6px}
.hist .cl{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:3px}
.hist .cl u{display:block;width:100%;border-radius:4px 4px 0 0;text-decoration:none;min-height:2px}
.hist .xl{display:flex;gap:3px;font-size:.58rem;color:var(--mut);margin-top:4px}
.hist .xl span{flex:1;text-align:center;overflow:hidden}
.wbar{display:flex;align-items:center;gap:8px;padding:7px 0;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.wbar:last-child{border-bottom:0}
.wbar .n{flex:1;min-width:0;font-size:.82rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wbar .tr{flex:0 0 42%;height:9px;background:var(--c-none);border-radius:99px;overflow:hidden}
.wbar .tr i{display:block;height:100%;background:var(--c-low)}
.wbar .v{flex:0 0 72px;text-align:right;font-size:.78rem;font-weight:700}
@media (min-width:900px){
  #app{max-width:1120px;padding-bottom:0}
  .wrap{padding:16px 18px 96px}
  .kpi{grid-template-columns:repeat(4,1fr);gap:12px}
  .kpi b{font-size:1.5rem}.kpi span{font-size:.76rem}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  .g2>*{margin-bottom:0}
  .gl{display:grid;grid-template-columns:1fr 1fr}
  .gl>*:nth-child(odd){border-right:1px solid var(--line)}
  .ulist{columns:2;column-gap:16px}
  .ulist .ur{break-inside:avoid}
  .nav{max-width:1120px;margin:0 auto;border-radius:16px 16px 0 0;border:1px solid var(--line);border-bottom:0}
  .ovl{max-width:480px;inset:auto;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    height:auto;max-height:94dvh;border-radius:18px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.4);border:1px solid var(--line)}
  .ovlbk{position:fixed;inset:0;z-index:49;background:rgba(6,14,24,.5)}
  .mdl .box{border-radius:16px;max-width:520px;margin-bottom:5vh}
  .mdl{align-items:center}
}
@media (max-width:360px){ .kpi{grid-template-columns:repeat(2,1fr)} }
</style>
</head>
<body>
<div id="app"></div>
<div id="ovl"></div>
<div id="mdl"></div>
<div class="toast" id="toast"></div>

function deviceId(){
  let d='';
  try{ d=localStorage.getItem('sansai_lux_v1_dev')||'' }catch(e){}
  if(!d){ d='d'+Math.random().toString(36).slice(2)+Date.now().toString(36); try{localStorage.setItem('sansai_lux_v1_dev',d)}catch(e){} }
  return d;
}
async function bkGet(params){
  const q=Object.assign({token:BK.token},params);
  const u=BK.url+(BK.url.indexOf('?')<0?'?':'&')+Object.keys(q).map(k=>encodeURIComponent(k)+'='+encodeURIComponent(q[k])).join('&');
  const r=await fetch(u,{method:'GET',redirect:'follow'});
  if(!r.ok) throw new Error('HTTP '+r.status);
  const j=await r.json();
  if(!j||!j.ok) throw new Error((j&&j.error)||'ชีตปฏิเสธคำขอ');
  return j;
}
async function bkPost(body){
  const r=await fetch(BK.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(Object.assign({token:BK.token},body)),redirect:'follow'});
  if(!r.ok) throw new Error('HTTP '+r.status);
  const j=await r.json();
  if(!j||!j.ok) throw new Error((j&&j.error)||'ชีตปฏิเสธคำขอ');
  return j;
}

/* ---------- theme ---------- */
function applyTheme(){
  const h=document.documentElement;
  h.setAttribute('data-theme',S.theme);
  const dark = S.theme==='dark' || (S.theme==='auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  h.classList.toggle('dk',S.theme==='auto'&&dark);
}
try{ const t=localStorage.getItem(LS+'_theme'); if(t) S.theme=t }catch(e){}
applyTheme();
if(window.matchMedia){ try{ window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme) }catch(e){} }

/* ---------- local mirror ---------- */
function lsKey(y){return LS+'_r'+y}
function mirror(){ try{
  localStorage.setItem(lsKey(S.year),JSON.stringify(S.readings));
  localStorage.setItem(LS+'_q',JSON.stringify(S.queue));
  localStorage.setItem(LS+'_lq',JSON.stringify(S.logq.slice(-400)));
}catch(e){} }
function loadMirror(){
  try{
    const a=localStorage.getItem(lsKey(S.year)); S.readings=a?JSON.parse(a)||{}:{};
    const p=localStorage.getItem(lsKey(S.year-1)); S.prev=p?JSON.parse(p)||{}:{};
    const q=localStorage.getItem(LS+'_q'); if(q) S.queue=JSON.parse(q)||[];
    const l=localStorage.getItem(LS+'_lq'); if(l) S.logq=JSON.parse(l)||[];
    const st=localStorage.getItem(LS+'_std'); if(st) S.std=Object.assign(S.std,JSON.parse(st)||{});
    const pn=localStorage.getItem(LS+'_pin'); if(pn) S.pin=pn;
    const sh=localStorage.getItem(LS+'_sheet'); if(sh) S.sheet=Object.assign(S.sheet,JSON.parse(sh)||{});
    const as=localStorage.getItem(LS+'_as'); if(as!=null) S.autosync=as==='1';
    const hd=localStorage.getItem(LS+'_hide'); if(hd!=null) S.hideDone=hd==='1';
  }catch(e){}
}

/* ---------- points ---------- */
function secRec(i){
  if(typeof i==='string'&&S.csec[i]) { const c=S.csec[i]; return [c.name,c.bld||c.name,c.floor||'',c.zone||''] }
  return SEED.SECS[i]||null;
}
function secName(i){ const s=secRec(i); return s?s[0]:'ไม่ระบุ' }
function bldName(i){ const s=secRec(i); return s?s[1]:'อื่นๆ' }
function allSecs(){
  const out=SEED.SECS.map((s,i)=>({i:i,s:s}));
  Object.keys(S.csec).sort().forEach(id=>out.push({i:id,s:secRec(id)}));
  return out;
}
function parseSec(v){ return /^[0-9]+$/.test(String(v))?+v:String(v) }
function basePoints(){
  return SEED.PTS.map(p=>({pid:pad3(p[0]),no:p[0],secIdx:p[1],name:p[2],work:p[3],l68:p[4],l69:p[5],hint:p[6]||'',custom:false}));
}
let _ck='',_cp=null;
function points(){
  const key=S.year+'|'+Object.keys(S.custom).sort().join()+'|'+Object.keys(S.csec).sort().join()+'|'+JSON.stringify(S.edits)+'|'+JSON.stringify(S.std);
  if(key===_ck&&_cp) return _cp;
  const out=basePoints();
  Object.keys(S.custom).forEach(pid=>{
    const c=S.custom[pid];
    if((c.year||SEED.CUR)<=S.year) out.push({pid:pid,no:'+',secIdx:c.secIdx,name:c.name,work:c.work,l68:null,l69:null,hint:'',custom:true,year:c.year});
  });
  out.forEach(p=>{
    const e=S.edits[p.pid];
    if(e){ if(e.name)p.name=e.name; if(e.work)p.work=e.work; if(e.secIdx!=null)p.secIdx=e.secIdx;
      if(e.std)p.stdOv=e.std; if(e.retiredYear)p.retiredYear=e.retiredYear }
    p.std=p.stdOv||S.std[p.work]||400;
  });
  _ck=key;_cp=out; return out;
}
function livePoints(){ return points().filter(p=>!(p.retiredYear&&p.retiredYear<S.year)) }
function bySec(i){ return livePoints().filter(p=>p.secIdx===i) }
function prevVal(p){
  if(S.year===2569) return {y:2568,v:p.l68};
  if(S.year===2570) return {y:2569,v:p.l69};
  const r=S.prev[p.pid]; return {y:S.year-1,v:r?r.lux:null};
}
function reading(p){ return S.readings[p.pid]||null }
function verdict(p,lux){ if(lux==null||isNaN(lux))return null; return lux>=p.std?'pass':'fail' }
function stats(list){
  let done=0,pass=0,fail=0,skip=0,chg=0;
  list.forEach(p=>{
    const r=reading(p); if(!r) return;
    if(r.status==='removed'){chg++;done++;skip++;return}
    if(r.status==='skip'){skip++;done++;return}
    if(r.status==='moved'||r.status==='new')chg++;
    if(r.lux!=null){done++; verdict(p,r.lux)==='pass'?pass++:fail++}
  });
  return {n:list.length,done:done,pass:pass,fail:fail,skip:skip,chg:chg,
    rate:(pass+fail)?Math.round(pass/(pass+fail)*100):0};
}
function histStats(key){
  let pass=0,fail=0,n=0;
  basePoints().forEach(p=>{ const v=p[key]; if(v==null)return; n++; const st=S.std[p.work]||400; v>=st?pass++:fail++ });
  return {pass:pass,fail:fail,n:n,miss:SEED.PTS.length-n,rate:n?Math.round(pass/n*100):0};
}

  db.collection('pointedits').onSnapshot(s=>{ S.edits={}; s.docs.forEach(d=>S.edits[d.id]=d.data()); _ck=''; render() },()=>{});

  db.collection('visits').onSnapshot(s=>{ S.visits=s.docs.map(d=>d.data()||{}); render() },()=>{});

    try{localStorage.setItem(LS+'_std',JSON.stringify(v.map))}catch(e){} render() } },()=>{});

async function bkLoad(silent){
  if(!bkOn()) return;
  if(SEED.BASE_YEARS.includes(S.year)){ S.readings=baseReadings(S.year); S.prev=S.year===2569?baseReadings(2568):{}; render(); return }
  try{
    const j=await bkGet({action:'read',year:S.year});
    S.readings=Object.assign({},j.rows||{},pendingFor(S.year));
    S.prev=j.prev||{};
    S.custom={}; (j.points||[]).forEach(p=>{ S.custom[p.pid]=p });
    S.csec={}; (j.secs||[]).forEach(c=>{ S.csec[c.id]=c });
    if(j.std&&Object.keys(j.std).length) S.std=Object.assign({},SEED.STD,j.std);
    if(j.visits) S.visitsAgg=j.visits;
    S.bkOk=true; S.bkErr=''; S.lastLoad=new Date().toISOString(); _ck=''; mirror(); render();
  }catch(e){
    S.bkOk=false; S.bkErr=String((e&&e.message)||e); render();
    if(!silent) toast('อ่านข้อมูลจากชีตไม่สำเร็จ: '+S.bkErr);
  }
}
function baseReadings(y){
  const o={},k=y===2568?'l68':'l69';
  basePoints().forEach(p=>{ const v=p[k]; if(v!=null) o[p.pid]={year:y,pid:p.pid,lux:v,status:'ok',note:'',loc:'',by:'',at:''} });
  return o;
}
let unsubA=null,unsubB=null;
function subYear(y,cb){
  if(unsubA){unsubA();unsubA=null} if(unsubB){unsubB();unsubB=null}
  if(bkOn()&&!SEED.BASE_YEARS.includes(y)){ bkLoad(true); if(cb)cb(); return }
  if(SEED.BASE_YEARS.includes(y)){ S.readings=baseReadings(y); S.prev=y===2569?baseReadings(2568):{}; if(cb)cb(); render(); return }
  if(!S.db){ if(cb)cb(); return }
  unsubA=S.db.collection('rounds/'+y+'/readings').onSnapshot(s=>{
    const m={}; s.docs.forEach(d=>m[d.id]=d.data());
    S.readings=Object.assign(m,pendingFor(y)); mirror(); if(cb&&!s.metadata.fromCache)cb(); render();
  },()=>{ if(cb)cb() });
  if(y-1>2569){
    unsubB=S.db.collection('rounds/'+(y-1)+'/readings').onSnapshot(s=>{
      const m={}; s.docs.forEach(d=>m[d.id]=d.data()); S.prev=m;
      try{localStorage.setItem(lsKey(y-1),JSON.stringify(m))}catch(e){} render();
    },()=>{});
  } else if(y===2570){ S.prev={} }
}
function pendingFor(y){ const o={}; S.queue.filter(q=>q.y===y&&q.c==='readings').forEach(q=>o[q.id]=q.body); return o }
async function put(coll,id,body,y){
  const yy=y||S.year;
  if(bkOn()){
    if(coll==='readings'){ queue(coll,id,body,yy); flush(); return true }
    if(coll==='customsecs'){ try{ await bkPost({action:'addsec',id:body.id,name:body.name,bld:body.bld,floor:body.floor,year:body.year}) }catch(e){ toast('เพิ่มหมวดลงชีตไม่สำเร็จ') } return true }
    if(coll==='custompoints'){ try{ await bkPost({action:'addpoint',pid:body.pid,secIdx:body.secIdx,secName:secName(body.secIdx),name:body.name,work:body.work,year:body.year}) }catch(e){ toast('เพิ่มจุดลงชีตไม่สำเร็จ ลองใหม่อีกครั้ง') } return true }
    if(coll==='settings'&&id==='standards'){ try{ await bkPost({action:'setstd',map:body.map}) }catch(e){} return true }
    return true;
  }
  const path=coll==='readings'?('rounds/'+yy+'/readings/'+id):(coll+'/'+id);
  if(!S.db){ queue(coll,id,body,yy); return false }
  try{ await S.db.doc(path).set(body); return true }
  catch(e){
    if(e&&e.code==='invalid_argument'){ if(!S.warned){S.warned=true;toast('บัญชีนี้ยังไม่มีสิทธิ์บันทึกข้อมูลกลาง (เก็บในเครื่องแทน)')} return false }
    queue(coll,id,body,yy); return false;
  }
}
function queue(c,id,body,y){ S.queue=S.queue.filter(q=>!(q.c===c&&q.id===id&&q.y===y)); S.queue.push({c:c,id:id,body:body,y:y}); mirror(); render() }
async function flush(){
  if(bkOn()){
    const items=S.queue.filter(q=>q.c==='readings');
    if(!items.length||S.flushing) return;
    S.flushing=true;
    try{
      await bkPost({action:'bulk',items:items.map(q=>q.body)});
      const done=new Set(items.map(q=>q.y+'|'+q.id));
      S.queue=S.queue.filter(q=>!(q.c==='readings'&&done.has(q.y+'|'+q.id)));
      S.bkOk=true; S.bkErr='';
    }catch(e){ S.bkOk=false; S.bkErr=String((e&&e.message)||e) }
    S.flushing=false; mirror(); render(); return;
  }
  if(!S.db||!S.queue.length) return;
  for(const it of S.queue.slice()){
    const path=it.c==='readings'?('rounds/'+it.y+'/readings/'+it.id):(it.c+'/'+it.id);
    try{ await S.db.doc(path).set(it.body); S.queue=S.queue.filter(x=>x!==it) }catch(e){ break }
  }
  mirror(); render();
}

const VISIT_GAP=30*60*1000;   // เข้าใหม่อีกครั้งหลังเว้นเกิน 30 นาที = นับเพิ่ม 1
function bumpLocalVisit(){
  let v={count:0,first:'',last:'',lastMs:0};
  try{ const s=localStorage.getItem(LS+'_visit'); if(s) v=Object.assign(v,JSON.parse(s)||{}) }catch(e){}
  const now=Date.now();
  if(now-(v.lastMs||0)>=VISIT_GAP){
    v.count=(v.count||0)+1; v.first=v.first||new Date().toISOString();
    v.last=new Date().toISOString(); v.lastMs=now;
    try{ localStorage.setItem(LS+'_visit',JSON.stringify(v)) }catch(e){}
  }
  S.localVisit=v;
}
async function trackVisit(){
  if(!S.db||!S.uid) return;
  const ref=S.db.doc('visits/'+S.uid);
  let cur=null;
  try{ const d=await ref.get(); cur=d.exists?d.data():null }catch(e){ return }
  const now=Date.now();
  if(cur&&now-(cur.lastMs||0)<VISIT_GAP) return;
  const body={count:((cur&&cur.count)||0)+1,first:(cur&&cur.first)||new Date().toISOString(),
    last:new Date().toISOString(),lastMs:now};
  try{ await ref.set(body) }catch(e){}
}
function visitStats(){
  if(bkOn()&&S.visitsAgg) return {people:S.visitsAgg.people||0,total:S.visitsAgg.total||0,today:S.visitsAgg.today||0,local:false,first:S.visitsAgg.first||''};
  if(!S.visits) return {people:0,total:S.localVisit.count||0,today:0,local:true,first:S.localVisit.first};
  const t0=new Date(); t0.setHours(0,0,0,0);
  let total=0,today=0,first='';
  S.visits.forEach(v=>{
    total+=v.count||0;
    if(v.last&&new Date(v.last)>=t0) today++;
    if(v.first&&(!first||v.first<first)) first=v.first;
  });
  return {people:S.visits.length,total:total,today:today,local:false,first:first};
}
function thDate(iso){
  if(!iso) return '-';
  const d=new Date(iso);
  return d.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'});
}

/* ---------- lock ---------- */
const LOCK_IDLE=15*60*1000;   // ไม่แตะหน้าจอเกิน 15 นาที = ล็อกอีกครั้ง
function setUnlocked(v){
  S.unlocked=v;
  try{
    if(v){ sessionStorage.setItem(LS+'_unl','1'); sessionStorage.setItem(LS+'_unlt',String(Date.now())) }
    else { sessionStorage.removeItem(LS+'_unl'); sessionStorage.removeItem(LS+'_unlt') }
  }catch(e){}
}
function touchLock(){ if(S.unlocked){ try{ sessionStorage.setItem(LS+'_unlt',String(Date.now())) }catch(e){} } }
function checkLock(){
  if(!S.unlocked) return;
  let t=0; try{ t=+(sessionStorage.getItem(LS+'_unlt')||0) }catch(e){}
  if(t&&Date.now()-t>LOCK_IDLE){
    setUnlocked(false);
    if(S.view!=='sum'){ S.view='sum'; S.entry=null; render(); toast('ล็อกอัตโนมัติ — ไม่ได้ใช้งานเกิน 15 นาที') }
  }
}
function requireUnlock(fn){ if(S.unlocked){fn();return} S.gate={fn:fn,buf:'',err:false,mode:'open'}; renderPin() }
function renderPin(){
  const g=S.gate; if(!g){ $('mdl').innerHTML=''; return }
  const t=g.mode==='change'?(g.step==='old'?'ใส่รหัสเดิม':g.step==='new'?'ตั้งรหัสใหม่ 4 หลัก':'ใส่รหัสใหม่อีกครั้ง'):'ใส่รหัสผ่านเพื่อเข้าใช้งาน';
  let b='';
  for(let i=0;i<4;i++) b+='<i class="'+(g.err?'err':(g.buf.length>i?'on':''))+'">'+(g.buf.length>i?'●':'')+'</i>';
  $('mdl').innerHTML='<div class="mdl"><div class="box" style="text-align:center">'+
    '<h3 style="text-align:center">🔒 '+t+'</h3>'+
    '<div class="sm">'+(g.err?'<span style="color:var(--fail)">รหัสไม่ถูกต้อง ลองใหม่อีกครั้ง</span>':'หน้าสรุป/รายงานเปิดดูได้โดยไม่ต้องใส่รหัส')+'</div>'+
    '<div class="pinbox">'+b+'</div>'+
    '<div class="keys" style="margin-top:6px">'+[1,2,3,4,5,6,7,8,9].map(k=>'<button data-act="pk" data-v="'+k+'">'+k+'</button>').join('')+
    '<button data-act="pcancel" class="sm" style="font-size:.85rem">ยกเลิก</button><button data-act="pk" data-v="0">0</button><button data-act="pbs" class="sm">⌫</button></div></div></div>';
}
function pinKey(d){
  const g=S.gate; if(!g||g.buf.length>=4) return;
  g.err=false; g.buf+=d;
  if(g.buf.length===4){
    const v=g.buf;
    if(g.mode==='open'){
      if(v===S.pin){ setUnlocked(true); S.gate=null; $('mdl').innerHTML=''; const f=g.fn; render(); if(f)f(); toast('ปลดล็อกแล้ว'); return }
      g.buf=''; g.err=true;
    }else{
      if(g.step==='old'){ v===S.pin?(g.step='new',g.buf=''):(g.buf='',g.err=true) }
      else if(g.step==='new'){ g.np=v; g.step='confirm'; g.buf='' }
      else{ if(v===g.np){ S.pin=v; try{localStorage.setItem(LS+'_pin',v)}catch(e){} put('settings','security',{pin:v,at:new Date().toISOString()});
        S.gate=null; $('mdl').innerHTML=''; toast('เปลี่ยนรหัสเรียบร้อย'); return } g.buf=''; g.step='new'; g.err=true }
    }
  }
  renderPin();
}

/* ---------- google sheets ---------- */
function sheetReady(){ return !!(S.mcp&&S.sheet.id) }
async function callSheet(tool,input){
  if(!S.mcp) throw {code:'no_mcp'};
  const r=await S.mcp.callTool('Google Sheets',tool,input);
  return r&&r.payload!==undefined?r.payload:r;
}
function sheetRows(){
  const out=[];
  allSecs().forEach(({i,s})=>{
    bySec(i).forEach(p=>{
      const r=reading(p)||{}, v=r.lux!=null?verdict(p,r.lux):null;
      out.push([p.custom?'ใหม่':p.no, s[1]+(s[2]?' ชั้น '+s[2]:''), s[3]||s[0], p.name, p.work, p.std,
        p.l68!=null?p.l68:'', p.l69!=null?p.l69:'', r.lux!=null?r.lux:'',
        v?(v==='pass'?'ผ่าน':'ไม่ผ่าน'):'', r.status&&r.status!=='ok'?STAT[r.status]:'',
        r.loc||'', r.note||'', r.byName||'', r.at?r.at.replace('T',' ').slice(0,16):'', p.pid]);
    });
  });
  while(out.length<600) out.push(['','','','','','','','','','','','','','','','']);
  return out;
}
async function syncSheet(silent){
  if(S.syncing) return;
  if(bkOn()){
    S.syncing=true; render();
    try{ await flush(); await bkPost({action:'rebuild',rows:sheetRows().filter(r=>r[3]!=='')}); await bkLoad(true);
      if(!silent) toast('อัปเดตตารางสรุปในชีตแล้ว'); }
    catch(e){ toast('อัปเดตตารางสรุปไม่สำเร็จ: '+String((e&&e.message)||e)) }
    S.syncing=false; render(); return;
  }
  if(!S.mcp){ if(!silent) toast('เครื่องนี้ยังเชื่อม Google Sheets ไม่ได้ — ต้องต่อ connector Google Sheets ในบัญชี claude.ai ก่อน'); return }
  if(!S.sheet.id){ if(!silent) sheetModal(); return }
  S.syncing=true; render(); if(!silent) toast('กำลังส่งขึ้น Google Sheets…');
  try{
    await callSheet('update_values',{spreadsheetId:S.sheet.id,range:"'"+S.sheet.main+"'!A2:P601",values:sheetRows()});
    if(S.logq.length){
      const rows=S.logq.map(x=>x);
      await callSheet('append_values',{spreadsheetId:S.sheet.id,range:"'"+S.sheet.log+"'!A1",values:rows});
      S.logq=[]; mirror();
    }
    S.lastSync=new Date().toISOString();
    try{ localStorage.setItem(LS+'_ls',S.lastSync) }catch(e){}
    if(!silent) toast('ส่งขึ้น Google Sheets เรียบร้อย ('+S.year+')');
  }catch(e){
    const c=(e&&e.code)||'';
    toast(c==='server_not_connected'?'ยังไม่ได้เชื่อม connector Google Sheets ในบัญชีนี้':
          c==='tool_error'?'ชีตปฏิเสธการเขียน — ตรวจชื่อแท็บ/สิทธิ์แก้ไข':'ส่งขึ้นชีตไม่สำเร็จ ลองใหม่อีกครั้ง');
  }
  S.syncing=false; render();
}
let syncT=null;

async function rebuildMain(silent){

  catch(e){ if(!silent) toast('อัปเดตตารางสรุปไม่สำเร็จ') }
  S.syncing=false; render();
}

function match(p,q){
  q=(q||'').trim().toLowerCase(); if(!q) return true;
  return (p.name||'').toLowerCase().includes(q)||secName(p.secIdx).toLowerCase().includes(q)||
         (p.work||'').toLowerCase().includes(q)||String(p.no).includes(q);
}
function yearsOf(p){
  const out=[[2568,p.l68],[2569,p.l69]];
  if(S.year>2569){
    if(S.year>2570){ const pv=prevVal(p); out.push([S.year-1,pv.v]) }
    const r=reading(p);
    out.push([S.year,(r&&r.lux!=null)?r.lux:null,r?r.status:null]);
  }
  const seen={};
  return out.filter(x=>{ if(seen[x[0]])return false; seen[x[0]]=1; return true });
}

function unitRows(){
  const m={};
  livePoints().forEach(p=>{
    const i=p.secIdx,s=secRec(i)||['','','',''];
    const u=m[i]||(m[i]={i:i,name:s[3]||s[0],bld:s[1]+(s[2]?' ชั้น '+s[2]:''),n:0,lo:0,mid:0,hi:0,todo:0});
    u.n++;
    const r=reading(p);
    if(!r||r.lux==null){ u.todo++; return }
    if(r.lux<p.std) u.lo++; else if(r.lux<=p.std+100) u.mid++; else u.hi++;
  });
  return Object.keys(m).map(k=>m[k]).sort((a,b)=>(b.lo-a.lo)||(b.hi-a.hi)||(b.n-a.n));
}

function openEntry(pid,list){
  const ps=list||(S.secIdx!=null?bySec(S.secIdx):livePoints());
  let i=ps.findIndex(p=>p.pid===pid); if(i<0) i=0;
  S.entry={list:ps.map(p=>p.pid),i:i}; loadBuf(); renderEntry();
}
function curP(){ const pid=S.entry.list[S.entry.i]; return livePoints().find(p=>p.pid===pid)||points().find(p=>p.pid===pid) }
function loadBuf(){
  const r=reading(curP())||{};
  S.entry.buf=r.lux!=null?String(r.lux):''; S.entry.status=r.status||'ok';
  S.entry.note=r.note||''; S.entry.loc=r.loc||''; S.entry.noteOpen=false;
}
function renderEntry(){

  const p=curP(),e=S.entry,pv=prevVal(p),ro=roYear();
  const lux=e.buf===''?null:parseFloat(e.buf), v=verdict(p,lux);
  const col=v==='pass'?'var(--pass)':v==='fail'?'var(--fail)':'var(--faint)';
  let vd=v==='pass'?'<span style="color:var(--pass)">✓ ผ่านเกณฑ์ (เกิน '+Math.round(lux-p.std)+' Lux)</span>'

      (e.noteOpen||e.note?'<input class="nt" placeholder="หมายเหตุ เช่น ปิดไฟ 1 ดวง, เปิดผ้าม่าน" value="'+esc(e.note)+'" data-act="note">':

function moveTo(i){ if(i<0||i>=S.entry.list.length){toast('สุดรายการแล้ว');return} S.entry.i=i; loadBuf(); renderEntry() }
async function saveEntry(advance){
  const e=S.entry,p=curP();
  const lux=e.buf===''?null:parseFloat(e.buf);
  if(e.status==='ok'&&lux==null){ toast('ยังไม่ได้ใส่ค่าแสง'); return }
  if(lux!=null&&(isNaN(lux)||lux<0||lux>100000)){ toast('ค่าที่ใส่ไม่ถูกต้อง'); return }
  let myName=''; if(S.user&&S.uid){ try{ const me=await S.user.me(); myName=(me&&me.name)||'' }catch(e2){} }
  const body={year:S.year,pid:p.pid,lux:lux,status:e.status,note:e.note||'',loc:e.loc||'',by:S.uid||'',byName:myName,
    at:new Date().toISOString(),std:p.std,name:p.name,sec:secName(p.secIdx)};
  S.readings[p.pid]=body;
  S.logq.push([body.at.replace('T',' ').slice(0,16),S.year,p.pid,p.name,secName(p.secIdx),lux==null?'':lux,p.std,
    lux!=null?(verdict(p,lux)==='pass'?'ผ่าน':'ไม่ผ่าน'):'',e.status!=='ok'?STAT[e.status]:'',e.loc||'',e.note||'',myName]);
  mirror();
  if(e.status==='removed'){ const ed=Object.assign({},S.edits[p.pid]||{},{retiredYear:S.year}); S.edits[p.pid]=ed; _ck=''; put('pointedits',p.pid,ed) }
  if(!S.rounds[S.year]&&!SEED.BASE_YEARS.includes(S.year)){ S.rounds[S.year]={year:S.year,openedAt:new Date().toISOString()}; put('rounds',String(S.year),S.rounds[S.year]) }
  put('readings',p.pid,body); S.dirtySince=Date.now(); queueSync();
  if(advance){
    let n=e.i+1;
    while(n<e.list.length){ const q=livePoints().find(x=>x.pid===e.list[n]); if(q&&!reading(q)) break; n++ }
    if(n>=e.list.length) n=e.i+1;
    if(n>=e.list.length){ S.entry=null; render(); toast('บันทึกครบรายการนี้แล้ว'); return }
    moveTo(n);
  }else{ S.entry=null; render(); toast('บันทึกแล้ว') }
}

  try{
    const b=new Blob([csvTxt()],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(b);
    const a=document.createElement('a'); a.href=u; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(u),2000);
  }catch(e){ copyModal() }
}

/* ---------- events ---------- */
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act,v=b.dataset.v;
  if(a==='nav'){ if(v==='sum'){S.view='sum';S.secIdx=null;S.entry=null;render()} else requireUnlock(()=>{S.view=v;S.secIdx=null;S.entry=null;render()}) }
  else if(a==='sec'){ S.secIdx=parseSec(v); S.view='sec'; S.q2=''; render() }
  else if(a==='home'){ S.view='home'; S.secIdx=null; render() }
  else if(a==='unit'){ const k=parseSec(v); S.sfilter=(S.sfilter===k?null:k); render() }
  else if(a==='unitall'){ S.unitAll=!S.unitAll; render() }
  else if(a==='filter'){ S.filter=v; render() }
  else if(a==='clr'){ S[v]=''; render() }
  else if(a==='open'){
    if(roYear()) return;                       // ปีย้อนหลัง: ดูในรายการได้เลย ไม่ต้องเปิดการ์ด
    const l=S.view==='sec'?bySec(S.secIdx):null; requireUnlock(()=>openEntry(v,l));
  }
  else if(a==='start'){ const ps=bySec(S.secIdx),t=ps.find(p=>!reading(p)); t?openEntry(t.pid,ps):toast('วัดครบแล้ว') }
  else if(a==='close'){ S.entry=null; render() }
  else if(a==='k'){ const e=S.entry; if(v==='.'&&e.buf.includes('.'))return; if(e.buf.replace('.','').length>6)return; e.buf+=v; renderEntry() }
  else if(a==='bs'){ S.entry.buf=S.entry.buf.slice(0,-1); renderEntry() }
  else if(a==='st'){ S.entry.status=v; if(v!=='moved')S.entry.loc=''; renderEntry() }
  else if(a==='opennote'){ S.entry.noteOpen=true; renderEntry(); const i=document.querySelector('[data-act="note"]'); if(i)i.focus() }
  else if(a==='save'){ saveEntry(true) }
  else if(a==='saveclose'){ saveEntry(false) }
  else if(a==='prev'){ moveTo(S.entry.i-1) }
  else if(a==='next'){ moveTo(S.entry.i+1) }
  else if(a==='addpt'){ addPointModal() }
  else if(a==='mclose'){ S.add=null; closeMdl() }
  else if(a==='hidedone'){ S.hideDone=!S.hideDone; try{localStorage.setItem(LS+'_hide',S.hideDone?'1':'0')}catch(e){} render() }
  else if(a==='apsec'){ S.add.sec=parseSec(v); S.add.q1=''; S.add.focus='apname'; renderAdd() }
  else if(a==='apnewsec'){
    const nm=v.trim(); if(!nm) return;
    const id='S'+Date.now().toString(36);
    const rec={id:id,name:nm,bld:nm,floor:'',zone:nm,year:S.year,at:new Date().toISOString()};
    S.csec[id]=rec; _ck=''; put('customsecs',id,rec);
    S.add.sec=id; S.add.q1=''; S.add.focus='apname'; renderAdd(); toast('เพิ่มหมวด “'+nm+'” แล้ว');
  }
  else if(a==='apclr1'){ S.add.sec=null; S.add.focus='apq1'; renderAdd() }
  else if(a==='apwork'){ S.add.work=v; S.add.q2=''; S.add.focus=''; renderAdd() }
  else if(a==='apclr2'){ S.add.work=''; S.add.focus='apq2'; renderAdd() }
  else if(a==='addsave'){
    const ad=S.add||{};
    if(ad.sec==null){ toast('เลือกหมวด/พื้นที่ก่อน'); return }
    const nm=(ad.name||'').trim(); if(!nm){toast('ใส่ชื่อจุดก่อน');return}
    if(!ad.work){ toast('เลือกลักษณะงานก่อน'); return }
    if(!S.std[ad.work]){ S.std[ad.work]=400; _ck=''; put('settings','standards',{map:S.std,at:new Date().toISOString()}) }
    const pid='C'+Date.now().toString(36);
    const c={pid:pid,secIdx:ad.sec,name:nm,work:ad.work,year:S.year,by:S.uid||'',at:new Date().toISOString()};
    const nsec=ad.sec;
    S.add=null;
    S.custom[pid]=c; _ck=''; put('custompoints',pid,c); closeMdl(); render();
    openEntry(pid,bySec(c.secIdx)); S.entry.status='new'; renderEntry(); toast('เพิ่มจุดแล้ว — ใส่ค่าแสงได้เลย');
  }
  else if(a==='copy'){ copyModal() }
  else if(a==='docopy'){ doCopy() }
  else if(a==='csv'){ doCsv() }
  else if(a==='sync'){ requireUnlock(()=>syncSheet(false)) }
  else if(a==='sheetcfg'){ sheetModal() }
  else if(a==='bkcfg'){ bkModal() }
  else if(a==='bksave'){
    BK.url=$('bk_url').value.trim(); BK.token=$('bk_tk').value.trim();
    try{ localStorage.setItem(LS+'_bk',JSON.stringify({url:BK.url,token:BK.token})) }catch(e){}
    closeMdl();
    bkGet({action:'ping'}).then(()=>{ toast('เชื่อมต่อชีตสำเร็จ'); bkLoad(false) })
      .catch(e=>toast('เชื่อมต่อไม่สำเร็จ: '+String((e&&e.message)||e)));
  }
  else if(a==='sheetsave'){
    const raw=$('sh_id').value.trim(); const m=raw.match(/\/d\/([a-zA-Z0-9-_]+)/);
    const cfg={id:m?m[1]:raw,main:$('sh_main').value.trim()||'สรุปปีปัจจุบัน',log:$('sh_log').value.trim()||'LOG'};
    S.sheet=cfg; try{localStorage.setItem(LS+'_sheet',JSON.stringify(cfg))}catch(e){}
    put('settings','sheets',Object.assign({at:new Date().toISOString()},cfg)); closeMdl(); render(); toast('บันทึกการตั้งค่าชีตแล้ว');
  }
  else if(a==='autos'){ S.autosync=!S.autosync; try{localStorage.setItem(LS+'_as',S.autosync?'1':'0')}catch(e){} render() }
  else if(a==='theme'){ S.theme=S.theme==='auto'?'light':S.theme==='light'?'dark':'auto'; try{localStorage.setItem(LS+'_theme',S.theme)}catch(e){} applyTheme(); render() }
  else if(a==='setth'){ S.theme=v; try{localStorage.setItem(LS+'_theme',v)}catch(e){} applyTheme(); render() }
  else if(a==='pk'){ pinKey(v) }
  else if(a==='pbs'){ if(S.gate){S.gate.buf=S.gate.buf.slice(0,-1);S.gate.err=false;renderPin()} }
  else if(a==='pcancel'){ S.gate=null; closeMdl() }
  else if(a==='chpin'){ S.gate={mode:'change',step:'old',buf:'',err:false}; renderPin() }
  else if(a==='unlockbtn'){ requireUnlock(()=>{ S.view='home'; render() }) }
  else if(a==='lock'){ setUnlocked(false); S.view='sum'; S.entry=null; render(); toast('ล็อกแล้ว') }
  else if(a==='stdm'||a==='stdp'){
    const w=b.dataset.v,n=Math.max(50,(S.std[w]||400)+(a==='stdp'?50:-50));
    S.std[w]=n; _ck=''; try{localStorage.setItem(LS+'_std',JSON.stringify(S.std))}catch(e){}
    put('settings','standards',{map:S.std,at:new Date().toISOString()}); render();
  }
  else if(a==='newround'){
    S.rounds[v]={year:+v,openedAt:new Date().toISOString(),by:S.uid||''};
    put('rounds',String(v),S.rounds[v]); S.year=+v; loadMirror(); subYear(S.year); render(); toast('เปิดรอบปี '+v+' แล้ว');
  }
});
document.addEventListener('change',ev=>{
  const b=ev.target.closest('[data-act]'); if(!b) return;
  if(b.dataset.act==='year'){ S.year=+b.value; S.entry=null; loadMirror(); subYear(S.year); render() }
  else if(b.dataset.act==='std'){
    const w=b.dataset.v,n=parseInt(b.value,10); if(isNaN(n))return;
    S.std[w]=n; _ck=''; try{localStorage.setItem(LS+'_std',JSON.stringify(S.std))}catch(e){}
    put('settings','standards',{map:S.std,at:new Date().toISOString()}); render(); toast('อัปเดตเกณฑ์ '+w+' = '+n+' Lux');
  }
});
document.addEventListener('input',ev=>{
  const b=ev.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act;
  if(a==='q'||a==='q2'||a==='q3'){
    S[a]=b.value; const p=b.selectionStart; render();
    const n=document.querySelector('[data-act="'+a+'"]'); if(n){n.focus();try{n.setSelectionRange(p,p)}catch(e){}}
  }
  else if(a==='apq1'||a==='apq2'||a==='apname'){
    if(!S.add) return;
    S.add[a==='apq1'?'q1':a==='apq2'?'q2':'name']=b.value;
    S.add.focus=a; if(a!=='apname') renderAdd();
  }
  else if(a==='note'&&S.entry){ S.entry.note=b.value }
  else if(a==='loc'&&S.entry){ S.entry.loc=b.value }
});
document.addEventListener('keydown',ev=>{
  if(S.gate&&/^[0-9]$/.test(ev.key)){ pinKey(ev.key); return }
  if(!S.entry) return;
  if(ev.target.tagName==='INPUT'||ev.target.tagName==='TEXTAREA') return;
  if(/^[0-9]$/.test(ev.key)){ S.entry.buf+=ev.key; renderEntry() }
  else if(ev.key==='.'&&!S.entry.buf.includes('.')){ S.entry.buf+='.'; renderEntry() }
  else if(ev.key==='Backspace'){ S.entry.buf=S.entry.buf.slice(0,-1); renderEntry() }
  else if(ev.key==='Enter'){ saveEntry(true) }
  else if(ev.key==='Escape'){ S.entry=null; render() }
  else if(ev.key==='ArrowLeft'){ moveTo(S.entry.i-1) }
  else if(ev.key==='ArrowRight'){ moveTo(S.entry.i+1) }
});
window.addEventListener('resize',()=>{ if(S.entry) renderEntry() });
['click','keydown'].forEach(ev=>document.addEventListener(ev,touchLock,true));
setInterval(checkLock,60000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) checkLock() });
boot();
</script>
</body>
</html>
